<!DOCTYPE html>
<!-- index.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Shop - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            color: #1a1a1a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo-section .tagline {
            color: #666;
            font-size: 14px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f8f8;
        }

        .form-group input:focus {
            outline: none;
            border-color: #dc2626;
            background: #ffffff;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #666;
        }

        .remember-me input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: #dc2626;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .login-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider span {
            padding: 0 16px;
        }

        .signup-section {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .signup-section a {
            color: #dc2626;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-section a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .alert.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">🚗</div>
            <h1>Tire Match</h1>
            <p class="tagline">Find the perfect tires for your vehicle</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="signup-section">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
<script>
    // CONFIGURATION - Replace with your actual Cognito values
    const COGNITO_CONFIG = {
        UserPoolId: 'us-east-1_lheuY4PU5',  // REPLACE WITH YOUR ACTUAL ID
        ClientId: '4hr8cktcge2tagvv46o13o3fsn',  // REPLACE WITH YOUR ACTUAL ID
        Region: 'us-east-1'
    };

    // Check if username was saved (Remember Me)
    window.addEventListener('DOMContentLoaded', function() {
        const savedUsername = localStorage.getItem('rememberMe');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('remember').checked = true;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('remember').checked;
        const alert = document.getElementById('alert');
        
        // Initialize Cognito User Pool
        const poolData = {
            UserPoolId: COGNITO_CONFIG.UserPoolId,
            ClientId: COGNITO_CONFIG.ClientId
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        
        // Create authentication details
        const authenticationData = {
            Username: username,
            Password: password,
        };
        const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);
        
        // Create cognito user
        const userData = {
            Username: username,
            Pool: userPool,
        };
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
        
        // Show loading
        alert.className = 'alert info';
        alert.textContent = 'Authenticating...';
        alert.style.display = 'block';
        
        // Authenticate user
        cognitoUser.authenticateUser(authenticationDetails, {
            onSuccess: function(result) {
                const idToken = result.getIdToken().getJwtToken();
                
                // Store tokens
                if (rememberMe) {
                    localStorage.setItem('authToken', idToken);
                    localStorage.setItem('tokenExpiry', Date.now() + (30 * 24 * 60 * 60 * 1000));
                    localStorage.setItem('rememberMe', username);
                } else {
                    sessionStorage.setItem('authToken', idToken);
                    localStorage.removeItem('rememberMe');
                }
                
                alert.className = 'alert success';
                alert.textContent = 'Login successful!';
                alert.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'search.html';
                }, 1000);
            },
            
            onFailure: function(err) {
                alert.className = 'alert error';
                alert.textContent = err.message || 'Authentication failed';
                alert.style.display = 'block';
                console.error('Login error:', err);
            },
            
            mfaRequired: function(codeDeliveryDetails) {
                alert.className = 'alert info';
                alert.textContent = '2FA code sent to ' + codeDeliveryDetails.DeliveryMedium;
                alert.style.display = 'block';
                
                const verificationCode = prompt('Enter the 2FA code sent to ' + codeDeliveryDetails.Destination);
                
                if (verificationCode) {
                    cognitoUser.sendMFACode(verificationCode, {
                        onSuccess: function(result) {
                            const idToken = result.getIdToken().getJwtToken();
                            
                            if (rememberMe) {
                                localStorage.setItem('authToken', idToken);
                                localStorage.setItem('tokenExpiry', Date.now() + (30 * 24 * 60 * 60 * 1000));
                                localStorage.setItem('rememberMe', username);
                            } else {
                                sessionStorage.setItem('authToken', idToken);
                            }
                            
                            alert.className = 'alert success';
                            alert.textContent = 'Login successful!';
                            
                            setTimeout(() => {
                                window.location.href = 'search.html';
                            }, 1000);
                        },
                        onFailure: function(err) {
                            alert.className = 'alert error';
                            alert.textContent = 'Invalid 2FA code';
                            alert.style.display = 'block';
                        }
                    });
                }
            },
            
            mfaSetup: function(challengeName, challengeParameters) {
                alert.className = 'alert info';
                alert.textContent = 'Setting up 2FA for first time...';
                alert.style.display = 'block';
                
                cognitoUser.associateSoftwareToken({
                    associateSecretCode: function(secretCode) {
                        const qrCodeUrl = 'otpauth://totp/TireShop:' + username + '?secret=' + secretCode + '&issuer=TireShop';
                        alert.className = 'alert info';
                        alert.innerHTML = 'Scan this QR code with your authenticator app:<br><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(qrCodeUrl) + '"><br>Or enter this code manually: ' + secretCode;
                        
                        const totpCode = prompt('Enter the code from your authenticator app:');
                        
                        if (totpCode) {
                            cognitoUser.verifySoftwareToken(totpCode, 'My Authenticator', {
                                onSuccess: function(result) {
                                    alert.className = 'alert success';
                                    alert.textContent = '2FA setup complete! Please login again.';
                                    
                                    setTimeout(() => {
                                        location.reload();
                                    }, 2000);
                                },
                                onFailure: function(err) {
                                    alert.className = 'alert error';
                                    alert.textContent = 'Invalid code. Please try again.';
                                    alert.style.display = 'block';
                                }
                            });
                        }
                    },
                    onFailure: function(err) {
                        alert.className = 'alert error';
                        alert.textContent = err.message;
                        alert.style.display = 'block';
                    }
                });
            }
        });
    });
</script>
</body>
</html>
