<!DOCTYPE html>
<!-- index.html - LOGIN PAGE (FIXED) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Shop - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            color: #1a1a1a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo-section .tagline {
            color: #666;
            font-size: 14px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f8f8;
        }

        .form-group input:focus {
            outline: none;
            border-color: #dc2626;
            background: #ffffff;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #666;
        }

        .remember-me input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: #dc2626;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .login-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider span {
            padding: 0 16px;
        }

        .signup-section {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .signup-section a {
            color: #dc2626;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-section a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .alert.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }

        .alert.info {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">🚗</div>
            <h1>Tire Match</h1>
            <p class="tagline">Find the perfect tires for your vehicle</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="signup-section">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
<script>
    // CONFIGURATION
    const COGNITO_CONFIG = {
        UserPoolId: 'us-east-1_lheuY4PU5',
        ClientId: '4hr8cktcge2tagvv46o13o3fsn',
        Region: 'us-east-1'
    };

    // Check if username was saved (Remember Me)
    window.addEventListener('DOMContentLoaded', function() {
        const savedUsername = localStorage.getItem('rememberMe');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('remember').checked = true;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('remember').checked;
        const alert = document.getElementById('alert');
        const loginBtn = document.querySelector('.login-btn');
        
        // Initialize Cognito User Pool
        const poolData = {
            UserPoolId: COGNITO_CONFIG.UserPoolId,
            ClientId: COGNITO_CONFIG.ClientId
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        
        // Create authentication details
        const authenticationData = {
            Username: username,
            Password: password,
        };
        const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);
        
        // Create cognito user
        const userData = {
            Username: username,
            Pool: userPool,
        };
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
        
        // Show loading
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
        alert.className = 'alert info';
        alert.textContent = 'Authenticating...';
        alert.style.display = 'block';
        
        // Authenticate user
        cognitoUser.authenticateUser(authenticationDetails, {
            onSuccess: function(result) {
                // Get tokens
                const idToken = result.getIdToken().getJwtToken();
                const accessToken = result.getAccessToken().getJwtToken();
                const refreshToken = result.getRefreshToken().getToken();
                
                console.log('✅ Login successful!');
                console.log('ID Token:', idToken.substring(0, 50) + '...');
                
                // Store tokens securely
                if (rememberMe) {
                    // Long-term storage (30 days)
                    localStorage.setItem('authToken', idToken);
                    localStorage.setItem('accessToken', accessToken);
                    localStorage.setItem('refreshToken', refreshToken);
                    localStorage.setItem('tokenExpiry', Date.now() + (30 * 24 * 60 * 60 * 1000));
                    localStorage.setItem('rememberMe', username);
                    localStorage.setItem('username', username);
                } else {
                    // Session only
                    sessionStorage.setItem('authToken', idToken);
                    sessionStorage.setItem('accessToken', accessToken);
                    sessionStorage.setItem('refreshToken', refreshToken);
                    sessionStorage.setItem('username', username);
                    localStorage.removeItem('rememberMe');
                }
                
                alert.className = 'alert success';
                alert.textContent = '✅ Login successful! Redirecting...';
                alert.style.display = 'block';
                
                // FIXED: Redirect to home.html (not search.html)
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);
            },
            
            onFailure: function(err) {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                
                alert.className = 'alert error';
                
                // User-friendly error messages
                if (err.code === 'UserNotConfirmedException') {
                    alert.textContent = 'Please verify your email first. Check your inbox for the verification code.';
                    
                    // Offer to resend verification
                    setTimeout(() => {
                        if (confirm('Would you like to go to the verification page?')) {
                            sessionStorage.setItem('pendingUsername', username);
                            window.location.href = 'verify.html?username=' + encodeURIComponent(username);
                        }
                    }, 2000);
                } else if (err.code === 'NotAuthorizedException') {
                    alert.textContent = 'Incorrect username or password';
                } else if (err.code === 'UserNotFoundException') {
                    alert.textContent = 'User not found. Please check your username or sign up.';
                } else {
                    alert.textContent = err.message || 'Authentication failed';
                }
                
                alert.style.display = 'block';
                console.error('Login error:', err);
            },
            
            mfaRequired: function(codeDeliveryDetails) {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                
                alert.className = 'alert info';
                alert.textContent = '2FA code sent to ' + codeDeliveryDetails.DeliveryMedium;
                alert.style.display = 'block';
                
                const verificationCode = prompt('Enter the 2FA code sent to ' + codeDeliveryDetails.Destination);
                
                if (verificationCode) {
                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Verifying...';
                    
                    cognitoUser.sendMFACode(verificationCode, {
                        onSuccess: function(result) {
                            const idToken = result.getIdToken().getJwtToken();
                            const accessToken = result.getAccessToken().getJwtToken();
                            const refreshToken = result.getRefreshToken().getToken();
                            
                            if (rememberMe) {
                                localStorage.setItem('authToken', idToken);
                                localStorage.setItem('accessToken', accessToken);
                                localStorage.setItem('refreshToken', refreshToken);
                                localStorage.setItem('tokenExpiry', Date.now() + (30 * 24 * 60 * 60 * 1000));
                                localStorage.setItem('rememberMe', username);
                                localStorage.setItem('username', username);
                            } else {
                                sessionStorage.setItem('authToken', idToken);
                                sessionStorage.setItem('accessToken', accessToken);
                                sessionStorage.setItem('refreshToken', refreshToken);
                                sessionStorage.setItem('username', username);
                            }
                            
                            alert.className = 'alert success';
                            alert.textContent = 'Login successful!';
                            
                            setTimeout(() => {
                                window.location.href = 'home.html';
                            }, 1000);
                        },
                        onFailure: function(err) {
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'Sign In';
                            
                            alert.className = 'alert error';
                            alert.textContent = 'Invalid 2FA code';
                            alert.style.display = 'block';
                        }
                    });
                } else {
                    alert.className = 'alert error';
                    alert.textContent = '2FA verification cancelled';
                    alert.style.display = 'block';
                }
            }
        });
    });
</script>
</body>
</html>
