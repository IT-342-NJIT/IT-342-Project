<!DOCTYPE html>
<!-- verify.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Shop - Verify Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verify-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .logo-section h1 {
            color: #1a1a1a;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo-section .tagline {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .username-display {
            background: #f0f9ff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            color: #1976d2;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            transition: all 0.3s ease;
            background: #f8f8f8;
            font-family: monospace;
        }

        .form-group input:focus {
            outline: none;
            border-color: #dc2626;
            background: #ffffff;
        }

        .verify-btn {
            width: 100%;
            padding: 14px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            margin-bottom: 16px;
        }

        .verify-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
        }

        .verify-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .resend-section {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #dc2626;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        .resend-btn:hover {
            color: #b91c1c;
        }

        .resend-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .alert.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }

        .alert.info {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #dc2626;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        #resendTimer {
            margin-top: 8px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="logo-section">
            <div class="logo-icon">✉️</div>
            <h1>Verify Your Email</h1>
            <p class="tagline">We've sent a 6-digit verification code to your email. Please enter it below.</p>
        </div>

        <div id="usernameDisplay" class="username-display" style="display:none;">
            Verifying account: <span id="usernameText"></span>
        </div>

        <div id="alert" class="alert"></div>

        <form id="verifyForm">
            <div class="form-group">
                <label for="verificationCode">Verification Code</label>
                <input 
                    type="text" 
                    id="verificationCode" 
                    name="verificationCode" 
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                    autofocus
                >
            </div>

            <button type="submit" class="verify-btn">Verify Email</button>
        </form>

        <div class="resend-section">
            Didn't receive the code? 
            <button class="resend-btn" id="resendBtn">Resend Code</button>
            <div id="resendTimer" style="display:none;">
                Wait <span id="countdown">60</span> seconds before resending
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>

    <script>
        const COGNITO_CONFIG = {
            UserPoolId: 'us-east-1_lheuY4PU5',
            ClientId: '4hr8cktcge2tagvv46o13o3fsn',
            Region: 'us-east-1'
        };

        // Get username from URL parameter OR session storage
        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('username') || sessionStorage.getItem('pendingUsername');
        
        console.log('📝 verify.html loaded');
        console.log('📝 URL username:', urlParams.get('username'));
        console.log('📝 Storage username:', sessionStorage.getItem('pendingUsername'));
        console.log('📝 Final username:', username);

        if (!username) {
            console.log('❌ No username found, redirecting to signup...');
            alert('No pending verification found. Please sign up first.');
            setTimeout(() => {
                window.location.href = 'signup.html';
            }, 1000);
        } else {
            // Show username
            console.log('✅ Username found:', username);
            document.getElementById('usernameDisplay').style.display = 'block';
            document.getElementById('usernameText').textContent = username;
            
            // Store in sessionStorage if it came from URL
            if (!sessionStorage.getItem('pendingUsername')) {
                sessionStorage.setItem('pendingUsername', username);
                console.log('📝 Saved username to sessionStorage');
            }
        }

        const poolData = {
            UserPoolId: COGNITO_CONFIG.UserPoolId,
            ClientId: COGNITO_CONFIG.ClientId
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        const userData = {
            Username: username,
            Pool: userPool
        };
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

        // Verify code
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const code = document.getElementById('verificationCode').value;
            const alert = document.getElementById('alert');
            
            if (code.length !== 6) {
                alert.className = 'alert error';
                alert.textContent = 'Please enter a 6-digit code';
                alert.style.display = 'block';
                return;
            }

            alert.className = 'alert info';
            alert.textContent = 'Verifying...';
            alert.style.display = 'block';

            cognitoUser.confirmRegistration(code, true, function(err, result) {
                if (err) {
                    console.error('Verification error:', err);
                    alert.className = 'alert error';
                    alert.textContent = err.message || 'Verification failed';
                    alert.style.display = 'block';
                    return;
                }

                console.log('✅ Email verified successfully!');
                alert.className = 'alert success';
                alert.textContent = 'Email verified successfully! Redirecting to login...';
                alert.style.display = 'block';

                // Clear pending username
                sessionStorage.removeItem('pendingUsername');

                // Redirect to login
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            });
        });

        // Resend code functionality
        let resendTimer;
        let resendCountdown = 60;

        document.getElementById('resendBtn').addEventListener('click', function() {
            const alert = document.getElementById('alert');
            const resendBtn = this;
            
            alert.className = 'alert info';
            alert.textContent = 'Resending verification code...';
            alert.style.display = 'block';

            cognitoUser.resendConfirmationCode(function(err, result) {
                if (err) {
                    console.error('Resend error:', err);
                    alert.className = 'alert error';
                    alert.textContent = err.message || 'Failed to resend code';
                    alert.style.display = 'block';
                    return;
                }

                console.log('✅ Verification code resent');
                alert.className = 'alert success';
                alert.textContent = 'New verification code sent to your email!';
                alert.style.display = 'block';

                // Start countdown timer
                resendBtn.disabled = true;
                document.getElementById('resendTimer').style.display = 'block';
                resendCountdown = 60;
                document.getElementById('countdown').textContent = resendCountdown;

                resendTimer = setInterval(() => {
                    resendCountdown--;
                    document.getElementById('countdown').textContent = resendCountdown;

                    if (resendCountdown <= 0) {
                        clearInterval(resendTimer);
                        resendBtn.disabled = false;
                        document.getElementById('resendTimer').style.display = 'none';
                    }
                }, 1000);
            });
        });

        // Auto-focus and format input
        document.getElementById('verificationCode').addEventListener('input', function(e) {
            // Only allow numbers
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
