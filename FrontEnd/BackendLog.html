<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Activity Logs</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    pre {
      background: #020617;
      padding: 1rem;
      border-radius: 0.75rem;
      max-height: 70vh;
      overflow: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <h1>Backend Activity Logs (DynamoDB)</h1>
  <button id="refresh">Refresh Logs</button>
  <pre id="logs">Loading...</pre>

  <script>
    // Same IP + port as logger.js
    const LOG_API_BASE = 'http://3.225.45.205:3000';

    async function loadLogs() {
      const logsEl = document.getElementById('logs');
      try {
        const res = await fetch(`${LOG_API_BASE}/api/logs`);
        const data = await res.json();
        logsEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        logsEl.textContent = 'Failed to load logs: ' + err;
      }
    }

    document.getElementById('refresh').addEventListener('click', loadLogs);
    loadLogs();
  </script>
</body>
</html>
